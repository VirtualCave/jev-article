<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Guardia: detección frente a falsas alarmas al mover el umbral">
<rect width="720" height="380" rx="12" fill="#fcfcfb"/>
<text x="24" y="30" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="600">Guardia: detección frente a falsas alarmas al mover el umbral</text>
<text x="24" y="48" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">60 textos (20 benignos, 20 inyecciones, 20 de extracción). Riesgo = 1 − P(benigno). Umbrales de 0,1 a 0,9.</text>
<g transform="translate(24,60)"><rect width="12" height="12" rx="3" fill="#B8144D"/><text x="18" y="10" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Jev 1.13</text></g><g transform="translate(174,60)"><rect width="12" height="12" rx="3" fill="#2F4F96"/><text x="18" y="10" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Laya</text></g>
