 fill="#B8144D" stroke="#fcfcfb" stroke-width="2"/><circle cx="94" cy="100" r="4" fill="#B8144D" stroke="#fcfcfb" stroke-width="2"/><circle cx="94" cy="100" r="4" fill="#B8144D" stroke="#fcfcfb" stroke-width="2"/><circle cx="70" cy="111" r="4" fill="#B8144D" stroke="#fcfcfb" stroke-width="2"/><polyline points="526,100 502,105.5 334,116.5 166,171.5 94,254 70,309" fill="none" stroke="#2F4F96" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="526" cy="100" r="4" fill="#2F4F96" stroke="#fcfcfb" stroke-width="2"/><circle cx="502" cy="105.5" r="4" fill="#2F4F96" stroke="#fcfcfb" stroke-width="2"/><circle cx="334" cy="116.5" r="4" fill="#2F4F96" stroke="#fcfcfb" stroke-width="2"/><circle cx="166" cy="171.5" r="4" fill="#2F4F96" stroke="#fcfcfb" stroke-width="2"/><circle cx="94" cy="254" r="4" fill="#2F4F96" stroke="#fcfcfb" stroke-width="2"/><circle cx="70" cy="309" r="4" fill="#2F4F96" stroke="#fcfcfb" stroke-width="2"/><text x="342" y="130.5" font-size="10" fill="#52514e" text-anchor="start" font-weight="400">umbral 0,3</text><text x="102" y="268" font-size="10" fill="#52514e" text-anchor="start" font-weight="400">umbral 0,7</text><text x="174" y="92" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="600">Jev (todos los umbrales ≥ 95 % de detección)</text><text x="367.6" y="188" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">Laya</text>
