<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 250" width="860" height="250" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Tetris: ¿mejora el modelo la lista corta que ya ordena el código?">
<rect width="860" height="250" rx="12" fill="#fcfcfb"/>
<text x="24" y="30" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="600">Tetris: ¿mejora el modelo la lista corta que ya ordena el código?</text>
<text x="24" y="48" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">5 semillas, máx. 200 piezas, mismos pozos para todos. La heurística juega siempre el primer candidato de la lista que se envía al modelo.</text>

