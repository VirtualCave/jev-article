<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Cascada Laya → Jev → persona: errores frente a uso de Jev">
<rect width="640" height="380" rx="12" fill="#fcfcfb"/>
<text x="24" y="30" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="600">Cascada Laya → Jev → persona: errores frente a uso de Jev</text>
<text x="24" y="48" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Departamento de 60 tickets. Umbral B (Jev → persona) fijo en 0,75; se mueve el umbral A (Laya → Jev).</text>
