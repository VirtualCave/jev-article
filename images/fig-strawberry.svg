<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 196" width="760" height="196" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Strawberry: acierto al contar letras según cómo se pregunte">
<rect width="760" height="196" rx="12" fill="#fcfcfb"/>
<text x="24" y="30" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="600">Strawberry: acierto al contar letras según cómo se pregunte</text>
<text x="24" y="48" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">8 palabras × 5 rondas por estrategia (40 intentos). Mediana de tiempo de pared y de tokens de entrada.</text>

<text x="210" y="97" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="400">1 consulta de recuento</text><path d="M220,84 H366 Q370,84 370,88 V98 Q370,102 366,102 H220 Z" fill="#B8144D"/><text x="376" y="97" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="400">50% · 232 ms · 379 tokens</text><text x="210" y="129" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="400">1 consulta con N preguntas</text><path d="M220,116 H388.5 Q392.5,116 392.5,120 V130 Q392.5,134 388.5,134 H220 Z" fill="#B8144D"/><text x="398.5" y="129" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="400">57% · 224 ms · 809 tokens</text><text x="210" y="161" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="400">N consultas simultáneas</text><path d="M220,148 H516 Q520,148 520,152 V162 Q520,166 516,166 H220 Z" fill="#B8144D"/><text x="526" y="161" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="400">100% · 267 ms · 2691 tokens</text>
</svg>